<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Umrah Transport System</title>
    <link rel="icon" type="image/x-icon" href="icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="css/entry.css" />
    <link rel="stylesheet" href="css/payment.css" />
    <link rel="stylesheet" href="css/ledger.css" />
    <link rel="stylesheet" href="css/records.css" />
    <link rel="stylesheet" href="css/report.css" />
    <link rel="stylesheet" href="css/daily-note.css" />
    <link rel="stylesheet" href="css/settings.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <!-- Lucide Icons Library -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
</head>

<body class="lang-ur">

    <!-- ===== FIREBASE LOADER ===== -->
    <div id="firebase-loader">
        <div class="loader-container">
            <div class="spinner-ring">
                <svg width="70" height="70" viewBox="0 0 70 70">
                    <circle cx="35" cy="35" r="28" fill="none" stroke="var(--gold)" stroke-width="4" stroke-dasharray="60 130" stroke-linecap="round" />
                    <circle cx="35" cy="35" r="28" fill="none" stroke="var(--gold-light)" stroke-width="4" stroke-dasharray="40 150" stroke-linecap="round" stroke-dashoffset="-40" />
                    <circle cx="35" cy="35" r="28" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="20 170" stroke-linecap="round" stroke-dashoffset="-80" />
                </svg>
                <div class="loader-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </div>
            </div>
            <div class="loader-text">ڈیٹا لوڈ ہو رہا ہے...</div>
            <div class="loader-bar"><div class="loader-bar-fill"></div></div>
            <div class="loader-sub">U M R A H &nbsp; T R A N S P O R T</div>
        </div>
    </div>

    <!-- ===== LOGIN PAGE ===== -->
    <div id="login-container" style="display:none;">
        <div class="login-card">
            <div class="login-logo" style="color:var(--gold);display:flex;align-items:center;justify-content:center;">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </div>
            <h2 id="login-title">لاگ ان کریں</h2>
            <p id="app-sub-login">Umrah Transport Management System</p>
            <div id="al-login"></div>
            <div class="login-fg">
                <label id="lbl-li-username">صارف نام</label>
                <input type="text" id="li-username" autocomplete="username" onkeydown="if(event.key==='Enter'){event.preventDefault();login();}" />
            </div>
            <div class="login-fg">
                <label id="lbl-li-password">پاس ورڈ</label>
                <div class="login-password-wrap">
                    <input type="password" id="li-password" class="login-password-input" autocomplete="current-password" onkeydown="if(event.key==='Enter'){event.preventDefault();login();}" />
                    <span id="toggle-password" class="password-toggle" onclick="togglePasswordVisibility()" title="Show Password">
                        <svg id="icon-eye" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </span>
                </div>
            </div>
            <button class="btn btn-login" id="btn-login-submit" onclick="login()">لاگ ان</button>
        </div>
    </div>

    <!-- ===== MAIN APP ===== -->
    <!-- ===== MAIN APP ===== -->
    <div id="main-app-container" style="display:none;" class="app-layout">

        <!-- MOBILE BACKDROP -->
        <div id="sidebar-backdrop" class="sidebar-backdrop" onclick="toggleSidebar(false)"></div>

        <!-- SIDEBAR -->
        <aside id="app-sidebar" class="app-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <div class="header-icon" id="header-logo-wrap" onclick="document.getElementById('logo-file-input').click()" title="لوگو تبدیل کریں">
                        <span id="header-logo-emoji" style="display:flex;align-items:center;justify-content:center;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--gold);"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                        </span>
                        <img id="header-logo-img" src="" alt="" style="display:none;" />
                    </div>
                    <input type="file" id="logo-file-input" accept="image/*" style="display:none;" onchange="handleLogoUpload(this)" />
                    <div class="sidebar-brand-text">
                        <h1 id="app-title">عمرہ ٹرانسپورٹ</h1>
                        <p id="app-sub">مینجمنٹ سسٹم</p>
                    </div>
                </div>
                <button class="sidebar-close-btn no-print" onclick="toggleSidebar(false)" aria-label="Close sidebar">✕</button>
            </div>

            <div class="sidebar-scrollable">
                <div class="sidebar-section-title" id="lbl-sidebar-nav">نیویگیشن</div>
                <nav id="main-nav" class="sidebar-nav">
                    <button class="active" id="nav-entry" onclick="showPage('entry',this)">
                        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        <span class="nav-text">نئی انٹری</span>
                    </button>
                    <button id="nav-payment" onclick="showPage('payment',this)">
                        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                        <span class="nav-text">ادائیگی</span>
                    </button>
                    <button id="nav-ledger" onclick="showPage('ledger',this)">
                        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                        <span class="nav-text">لیجر</span>
                    </button>
                    <button id="nav-records" onclick="showPage('records',this)">
                        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                        <span class="nav-text">تمام ریکارڈز</span>
                    </button>
                    <button id="nav-report" onclick="showPage('report',this)">
                        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                        <span class="nav-text">رپورٹس</span>
                    </button>
                    <button id="nav-dailynote" onclick="showPage('dailynote',this)">
                        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                        <span class="nav-text">ڈیلی رپورٹ</span>
                    </button>
                    <button id="nav-settings" onclick="showPage('settings',this)">
                        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                        <span class="nav-text">سیٹنگز</span>
                    </button>
                    <button id="nav-admin-panel" onclick="showPage('admin',this)" style="display:none;">
                        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                        <span class="nav-text">ایڈمن پینل</span>
                    </button>
                </nav>
            </div>

            <div class="sidebar-footer">
                <div class="sidebar-user" id="user-status-wrap">
                    <div class="sidebar-user-avatar">
                        <span class="user-status-dot"></span>
                        <span id="sidebar-user-initial">A</span>
                    </div>
                    <div class="sidebar-user-info">
                        <span class="header-user-name" id="lbl-logged-in-user">admin</span>
                        <span class="role-badge" id="role-badge" style="display:none;"></span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN APP CONTENT AREA -->
        <div class="app-main">
            <!-- TOPBAR UTILITY HEADER -->
            <header class="app-topbar no-print">
                <div class="topbar-start">
                    <button class="topbar-menu-toggle" onclick="toggleSidebar()" aria-label="Toggle Navigation">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                    </button>
                    <div class="topbar-breadcrumb">
                        <span class="topbar-breadcrumb-title" id="topbar-current-page">نئی انٹری</span>
                    </div>
                </div>

                <div class="topbar-end">
                    <!-- Global Dark/Light Mode Switcher -->
                    <button class="topbar-theme-btn" id="theme-toggle-btn" onclick="toggleAppTheme()" title="تبدیل تھیم (Light / Dark)">
                        <span id="theme-toggle-icon">🌙</span>
                        <span class="theme-btn-text" id="theme-btn-text">ڈارک</span>
                    </button>
                    <div class="lang-switcher">
                        <button class="lang-btn active" id="lb-ur" onclick="setLang('ur')">اردو</button>
                        <button class="lang-btn" id="lb-en" onclick="setLang('en')">EN</button>
                        <button class="lang-btn" id="lb-ar" onclick="setLang('ar')">ع</button>
                    </div>
                    <button class="btn-logout" id="btn-logout" onclick="logout()" title="لاگ آؤٹ">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-2px;margin-inline-end:4px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        <span class="logout-text">لاگ آؤٹ</span>
                    </button>
                </div>
            </header>

            <main class="wrap">
                <div id="mdi-tabs" class="mdi-tabs no-print"></div>

                <!-- ===== MODULAR PAGES (LOADED DYNAMICALLY FROM /pages) ===== -->
                <div id="page-entry" class="page active"></div>
                <div id="page-payment" class="page"></div>
                <div id="page-ledger" class="page"></div>
                <div id="page-records" class="page"></div>

                <div id="page-report" class="page"></div>
                <div id="page-dailynote" class="page"></div>
                <div id="page-settings" class="page"></div>
                <div id="page-admin" class="page" style="padding:0;"></div>
            </main><!-- /wrap -->
        </div><!-- /app-main -->
    </div><!-- /main-app-container -->

    <!-- ===== MODALS ===== -->
    <div class="mo" id="modal"><div class="md"><h3 id="m-title"></h3><input type="text" id="m-input" placeholder="" /><div class="md-btns"><button class="btn btn-p" id="btn-msave" onclick="confirmModal()">شامل کریں</button><button class="btn btn-o" id="btn-mcancel" onclick="closeModal()">منسوخ</button></div></div></div>
    <div class="mo" id="del-modal"><div class="md del-md"><div class="del-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--red);"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><h3 id="del-m-title"></h3><p id="del-m-msg"></p><input type="password" id="del-m-input" placeholder="" /><div class="md-btns" style="justify-content:center;margin-top:20px;"><button class="btn btn-d" id="btn-del-confirm" onclick="confirmDeleteModal()">حذف کریں</button><button class="btn btn-o" id="btn-del-cancel" onclick="closeDeleteModal()">منسوخ</button></div></div></div>

    <!-- ===== COPY VOUCHER MODAL ===== -->
    <div class="mo" id="copy-modal" onclick="if(event.target===this)closeCopyModal()">
        <div class="md" style="max-width:520px;width:95%;padding:0;overflow:hidden;border-radius:16px;">
            <!-- Header -->
            <div style="background:linear-gradient(135deg, var(--charcoal-blue) 0%, var(--dark-slate-grey) 100%);padding:18px 22px;display:flex;align-items:center;gap:12px;">
                <div>
                    <h3 style="margin:0;color:#fff;font-size:16px;">واوچر کاپی کریں</h3>
                    <p style="margin:0;color:rgba(255,255,255,0.75);font-size:12px;" id="copy-modal-voucher-label">واوچر: —</p>
                </div>
                <button onclick="closeCopyModal()" style="margin-inline-start:auto;background:rgba(255,255,255,0.15);border:none;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.3)'" onmouseout="this.style.background='rgba(255,255,255,0.15)'">✕</button>
            </div>
            <!-- Original Record Info -->
            <div style="background:var(--surface-alt);border-bottom:1px solid var(--border);padding:12px 22px;font-size:12px;color:var(--text);" id="copy-modal-info"></div>
            <!-- Form -->
            <div style="padding:18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                <div class="fg" style="grid-column:1/-1;">
                    <label style="font-size:12px;color:var(--muted);margin-bottom:4px;display:block;">نئی تاریخ</label>
                    <input type="date" id="copy-date" style="width:100%;box-sizing:border-box;" />
                </div>
                <div class="fg">
                    <label style="font-size:12px;color:var(--muted);margin-bottom:4px;display:block;">نیا سیکٹر</label>
                    <select id="copy-sector" style="width:100%;box-sizing:border-box;"></select>
                </div>
                <div class="fg">
                    <label style="font-size:12px;color:var(--muted);margin-bottom:4px;display:block;">ٹرانسپورٹ</label>
                    <select id="copy-transport" style="width:100%;box-sizing:border-box;"></select>
                </div>
                <div class="fg">
                    <label style="font-size:12px;color:var(--muted);margin-bottom:4px;display:block;">فی کس کرایہ</label>
                    <input type="number" id="copy-fare" style="width:100%;box-sizing:border-box;" min="0" />
                </div>
                <div class="fg">
                    <label style="font-size:12px;color:var(--muted);margin-bottom:4px;display:block;">حجاج کی تعداد</label>
                    <input type="number" id="copy-count" style="width:100%;box-sizing:border-box;" min="0" />
                </div>
            </div>
            <div id="al-copy" style="padding:0 22px;"></div>
            <!-- Footer Buttons -->
            <div style="padding:14px 22px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--border);background:var(--bg-page);">
                <button class="btn btn-o" onclick="closeCopyModal()" id="btn-copy-cancel">منسوخ</button>
                <button class="btn btn-p" onclick="confirmCopyVoucher()" id="btn-copy-confirm">کاپی کریں</button>
            </div>
        </div>
    </div>

    <!-- ===== EDIT RECORD MODAL ===== -->
    <div class="mo" id="edit-record-modal" onclick="if(event.target===this)closeEditRecordModal()">
        <div class="md edit-record-md" style="max-width:760px;width:95%;padding:0;overflow:hidden;border-radius:16px;max-height:90vh;display:flex;flex-direction:column;border-top:none;box-shadow:0 20px 60px rgba(0,0,0,0.35);">
            <!-- Modal Header -->
            <div class="edit-modal-hdr" style="background:linear-gradient(135deg, var(--charcoal-blue, #2f3e46) 0%, var(--dark-slate-grey, #354f52) 100%);padding:16px 22px;display:flex;align-items:center;justify-content:space-between;color:#fff;border-bottom:1px solid rgba(255,255,255,0.1);">
                <div style="display:flex;align-items:center;gap:12px;">
                    <div style="width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                    </div>
                    <div>
                        <h3 style="margin:0;color:#fff;font-size:16px;font-weight:700;" id="edit-rec-m-title">ریکارڈ میں تبدیلی کریں (Edit Record)</h3>
                        <div style="display:flex;align-items:center;gap:8px;margin-top:3px;">
                            <span class="voucher-tag" id="edit-rec-modal-voucher-badge" style="background:rgba(255,255,255,0.2);color:#fff;font-size:11.5px;padding:2px 8px;border-radius:6px;font-weight:600;">واوچر: —</span>
                            <span id="edit-rec-modal-party-badge" style="color:rgba(255,255,255,0.8);font-size:11.5px;"></span>
                        </div>
                    </div>
                </div>
                <button type="button" onclick="closeEditRecordModal()" aria-label="Close" style="background:rgba(255,255,255,0.15);border:none;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.3)'" onmouseout="this.style.background='rgba(255,255,255,0.15)'">✕</button>
            </div>

            <!-- Modal Scrollable Body -->
            <div class="edit-modal-body" style="padding:20px 22px;overflow-y:auto;flex:1;background:var(--white);">
                <div id="al-edit-record" style="margin-bottom:14px;"></div>
                <input type="hidden" id="edit-rec-id" />

                <!-- Group 1: Booking Essentials -->
                <div style="margin-bottom:18px;">
                    <div style="font-size:13px;font-weight:700;color:var(--primary);margin-bottom:12px;display:flex;align-items:center;gap:6px;">
                        <span>📋</span> <span>بنیادی بکنگ معلومات</span>
                    </div>
                    <div class="grid edit-modal-grid-3" style="display:grid;grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));gap:12px;margin-bottom:12px;">
                        <div class="fg">
                            <label style="font-size:12px;color:var(--muted);margin-bottom:4px;display:block;">تاریخ</label>
                            <input type="date" id="edit-rec-date" style="width:100%;box-sizing:border-box;" />
                        </div>
                        <div class="fg">
                            <label style="font-size:12px;color:var(--muted);margin-bottom:4px;display:block;">واوچر نمبر</label>
                            <input type="text" id="edit-rec-voucher" style="width:100%;box-sizing:border-box;font-weight:700;color:var(--primary);" />
                        </div>
                        <div class="fg">
                            <label style="font-size:12px;color:var(--muted);margin-bottom:4px;display:block;">ٹرانسپورٹر</label>
                            <select id="edit-rec-party" style="width:100%;box-sizing:border-box;"></select>
                        </div>
                    </div>

                    <div class="grid edit-modal-grid-3" style="display:grid;grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));gap:12px;margin-bottom:12px;">
                        <div class="fg">
                            <label style="font-size:12px;color:var(--muted);margin-bottom:4px;display:block;">حاجی پارٹی</label>
                            <input type="text" id="edit-rec-new-party" list="edit-rec-haji-party-list" placeholder="ہاجی پارٹی درج یا منتخب کریں" style="width:100%;box-sizing:border-box;" />
                            <datalist id="edit-rec-haji-party-list"></datalist>
                        </div>
                        <div class="fg">
                            <label style="font-size:12px;color:var(--muted);margin-bottom:4px;display:block;">سیکٹر</label>
                            <select id="edit-rec-sector" onchange="calcEditRecordTotal()" style="width:100%;box-sizing:border-box;"></select>
                        </div>
                        <div class="fg">
                            <label style="font-size:12px;color:var(--muted);margin-bottom:4px;display:block;">ٹرانسپورٹ</label>
                            <select id="edit-rec-transport" onchange="calcEditRecordTotal()" style="width:100%;box-sizing:border-box;"></select>
                        </div>
                    </div>

                    <div class="grid edit-modal-grid-3" style="display:grid;grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));gap:12px;">
                        <div class="fg">
                            <label style="font-size:12px;color:var(--muted);margin-bottom:4px;display:block;">حاجیوں کی تعداد</label>
                            <input type="number" id="edit-rec-count" min="1" oninput="calcEditRecordTotal()" style="width:100%;box-sizing:border-box;" />
                        </div>
                        <div class="fg">
                            <label id="lbl-edit-rec-fare" style="font-size:12px;color:var(--muted);margin-bottom:4px;display:block;">کرایہ (SAR)</label>
                            <input type="number" id="edit-rec-fare" min="0" oninput="calcEditRecordTotal()" style="width:100%;box-sizing:border-box;" />
                        </div>
                        <div class="fg">
                            <label style="font-size:12px;color:var(--muted);margin-bottom:4px;display:block;font-weight:700;">کل رقم (SAR)</label>
                            <input type="number" id="edit-rec-total" readonly style="width:100%;box-sizing:border-box;font-weight:700;background:var(--cream-dark);color:var(--text);" />
                        </div>
                    </div>
                </div>

                <!-- Group 2: Flight & Passenger Details (Collapsible/Toggle) -->
                <div style="background:var(--surface-alt, rgba(0,0,0,0.02));border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:18px;">
                    <label style="display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;color:var(--primary);cursor:pointer;margin-bottom:0;">
                        <div style="display:flex;align-items:center;gap:8px;">
                            <input type="checkbox" id="edit-rec-show-flight" onchange="toggleEditFlightDetails()" />
                            <span>✈️ فلائیٹ اور ائیرپورٹ تفصیلات</span>
                        </div>
                        <span style="font-size:11px;padding:2px 8px;border-radius:4px;background:var(--cream-dark);color:var(--muted);font-weight:500;">اختیاری</span>
                    </label>

                    <div id="edit-rec-flight-section" style="display:none;margin-top:14px;">
                        <div class="grid" style="display:grid;grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));gap:12px;">
                            <div class="fg">
                                <label style="font-size:12px;color:var(--muted);margin-bottom:4px;display:block;">نام (Name)</label>
                                <input type="text" id="edit-rec-name" style="width:100%;box-sizing:border-box;" />
                            </div>
                            <div class="fg">
                                <label style="font-size:12px;color:var(--muted);margin-bottom:4px;display:block;">وقت آمد (Arrival Time)</label>
                                <input type="time" id="edit-rec-flight-time" style="width:100%;box-sizing:border-box;" />
                            </div>
                            <div class="fg">
                                <label style="font-size:12px;color:var(--muted);margin-bottom:4px;display:block;">فلائیٹ نمبر (Flight No)</label>
                                <input type="text" id="edit-rec-flight-no" style="width:100%;box-sizing:border-box;" />
                            </div>
                            <div class="fg">
                                <label style="font-size:12px;color:var(--muted);margin-bottom:4px;display:block;">ائیرپورٹ (Airport)</label>
                                <input type="text" id="edit-rec-airport" list="edit-rec-airport-list" style="width:100%;box-sizing:border-box;" />
                                <datalist id="edit-rec-airport-list">
                                    <option value="Jeddah Airport (KAIA)"></option>
                                    <option value="Madinah Airport (AMAA)"></option>
                                </datalist>
                            </div>
                        </div>

                        <div class="grid" style="display:grid;grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));gap:12px;margin-top:10px;">
                            <div class="fg">
                                <label style="font-size:12px;color:var(--muted);margin-bottom:4px;display:block;">نوعیت (Nature)</label>
                                <select id="edit-rec-nature" style="width:100%;box-sizing:border-box;"></select>
                            </div>
                            <div class="fg">
                                <label style="font-size:12px;color:var(--muted);margin-bottom:4px;display:block;">شرکہ (Shirka)</label>
                                <input type="text" id="edit-rec-shirka" list="edit-rec-shirka-list" style="width:100%;box-sizing:border-box;" />
                                <datalist id="edit-rec-shirka-list"></datalist>
                            </div>
                            <div class="fg">
                                <label style="font-size:12px;color:var(--muted);margin-bottom:4px;display:block;">گروپ نمبر (Group No)</label>
                                <input type="text" id="edit-rec-group" style="width:100%;box-sizing:border-box;" />
                            </div>
                            <div class="fg">
                                <label style="font-size:12px;color:var(--muted);margin-bottom:4px;display:block;">موبائل (Mobile)</label>
                                <input type="text" id="edit-rec-mobile" style="width:100%;box-sizing:border-box;direction:ltr;text-align:right;" />
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Group 3: Notes -->
                <div class="fg">
                    <label style="font-size:12px;color:var(--muted);margin-bottom:4px;display:block;">نوٹس (Notes)</label>
                    <textarea id="edit-rec-notes" rows="2" placeholder="اضافی ہدایات یا نوٹس..." style="width:100%;box-sizing:border-box;resize:vertical;"></textarea>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="edit-modal-footer" style="padding:14px 22px;display:flex;align-items:center;justify-content:flex-end;gap:10px;border-top:1px solid var(--border);background:var(--bg-page);">
                <button type="button" class="btn btn-o" onclick="closeEditRecordModal()" id="btn-cancel-edit-rec">منسوخ</button>
                <button type="button" class="btn btn-p" onclick="saveRecordEditModal()" id="btn-save-edit-rec" style="display:inline-flex;align-items:center;gap:6px;">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                    <span>تبدیلی محفوظ کریں</span>
                </button>
            </div>
        </div>
    </div>


    <!-- ===== FIREBASE SDK ===== -->

    </script>

    </script>

    </script>
    <script src="scripts/auth/auth.js">
    </script>
    <script src="scripts/pages/entry.js">

    <script src="scripts/pages/payment.js">
    </script>
    <script src="scripts/pages/ledger.js">
    </script>
    <script src="scripts/pages/records.js">
    </script>
    <script src="scripts/pages/report.js">
    </script>
    <script src="scripts/pages/daily-note.js">
    </script>
    <script src="scripts/pages/settings.js">
    </script>
    <script src="scripts/ui/navigation.js">
