<!-- ===== DAILY NOTE REPORT ===== -->
<div class="card dn-filter-card">
    <!-- Card Header Bar -->
    <div class="card-header-bar">
        <div class="card-title-group">
            <div class="card-title-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                    <path d="M8 14h.01"/>
                    <path d="M12 14h.01"/>
                    <path d="M16 14h.01"/>
                    <path d="M8 18h.01"/>
                    <path d="M12 18h.01"/>
                </svg>
            </div>
            <div class="card-title-text">
                <h2 class="card-title" id="lbl-dnRepTitle">ڈیلی رپورٹ</h2>
                <div class="card-subtitle">ڈیلی ٹرانسپورٹ آپریشنز، ارائیول اور ڈیپارچر شیڈول</div>
            </div>
        </div>

        <!-- Header Actions: Print / Excel / Reset -->
        <div class="card-header-actions dn-hdr-actions">
            <button type="button" class="btn btn-o btn-hdr no-print" id="btn-print-dn" onclick="printCurrentPage()" title="پرنٹ">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 6 2 18 2 18 9" />
                    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
                    <rect x="6" y="14" width="12" height="8" />
                </svg>
                <span id="lbl-btn-print-dn">پرنٹ</span>
            </button>
            <button type="button" class="btn btn-o btn-hdr no-print" id="btn-export-dn" onclick="exportDailyNoteExcel()" title="Excel ایکسپورٹ">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
                <span id="lbl-btn-excel-dn">Excel</span>
            </button>
            <button type="button" class="btn btn-o btn-hdr no-print" id="btn-dn-resetrep" onclick="clearDailyNoteReport()" title="فلٹر صاف کریں">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                    <path d="M21 3v5h-5"/>
                    <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                    <path d="M8 16H3v5"/>
                </svg>
                <span id="lbl-btn-reset-dn">صاف</span>
            </button>
        </div>
    </div>

    <!-- Filter Grid -->
    <div class="grid dn-filter-grid">
        <div class="fg">
            <label id="lbl-dnRepFrom">تاریخ سے</label>
            <input type="date" id="dnr-from" onchange="renderDailyNoteReport()" />
        </div>
        <div class="fg">
            <label id="lbl-dnRepTo">تاریخ تک</label>
            <input type="date" id="dnr-to" onchange="renderDailyNoteReport()" />
        </div>
        <div class="fg fg-multi">
            <label id="lbl-dnRepNature">TRANSPORT By</label>
            <div class="custom-multi-select" id="dnr-nature-multi-select">
                <div class="cms-header" onclick="toggleDnrNatureMultiSelect(event)">
                    <span id="dnr-nature-selected-text">-- All --</span>
                    <span class="cms-arrow">▼</span>
                </div>
                <div class="cms-dropdown" id="dnr-nature-dropdown-container" style="display:none;">
                    <div class="cms-dropdown-actions">
                        <button type="button" class="cms-btn-link" onclick="selectAllDnrNature(true)">All</button>
                        <span class="cms-sep">|</span>
                        <button type="button" class="cms-btn-link" onclick="selectAllDnrNature(false)">None</button>
                    </div>
                    <div id="dnr-nature-checkboxes"></div>
                </div>
            </div>
        </div>
        <div class="fg fg-multi">
            <label id="lbl-dnRepTransporter">Transporter / ٹرانسپورٹر</label>
            <div class="custom-multi-select" id="dnr-transporter-multi-select">
                <div class="cms-header" onclick="toggleDnrTransporterMultiSelect(event)">
                    <span id="dnr-transporter-selected-text">-- All --</span>
                    <span class="cms-arrow">▼</span>
                </div>
                <div class="cms-dropdown" id="dnr-transporter-dropdown-container" style="display:none;">
                    <div class="cms-dropdown-actions">
                        <button type="button" class="cms-btn-link" onclick="selectAllDnrTransporter(true)">All</button>
                        <span class="cms-sep">|</span>
                        <button type="button" class="cms-btn-link" onclick="selectAllDnrTransporter(false)">None</button>
                    </div>
                    <div id="dnr-transporter-checkboxes"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Print Header -->
    <div class="print-header">
        <div class="ph-title">Umrah Transport Management System</div>
        <div class="ph-sub ph-sub-text">ڈیلی رپورٹ — Daily Operations Report</div>
        <div class="ph-meta">
            <span class="ph-range" id="dn-print-range"></span>
            <span class="ph-printed-on" id="dn-print-date"></span>
        </div>
    </div>

    <!-- Report Output Container -->
    <div id="dn-report-out" class="dn-output-wrap"></div>

    <!-- Print Footer -->
    <div class="print-footer">Umrah Transport Management System — Daily Operations Report</div>
</div>
</body>
