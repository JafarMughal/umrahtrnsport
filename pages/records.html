<!-- ===== ALL RECORDS ===== -->
<div class="card records-filter-card">
    <!-- Card Header Bar -->
    <div class="card-header-bar">
        <div class="card-title-group">
            <div class="card-title-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="8" y1="6" x2="21" y2="6"/>
                    <line x1="8" y1="12" x2="21" y2="12"/>
                    <line x1="8" y1="18" x2="21" y2="18"/>
                    <line x1="3" y1="6" x2="3.01" y2="6"/>
                    <line x1="3" y1="12" x2="3.01" y2="12"/>
                    <line x1="3" y1="18" x2="3.01" y2="18"/>
                </svg>
            </div>
            <div class="card-title-text">
                <h2 class="card-title" id="lbl-recTitle">تمام ریکارڈز</h2>
                <div class="card-subtitle">واوچرز کی مکمل تفصیل، سرچ، فلٹرز اور ریکارڈ مینجمنٹ</div>
            </div>
        </div>

        <!-- Header Actions: Filter / Print / Clear -->
        <div class="card-header-actions records-hdr-actions">
            <button type="button" class="btn btn-p btn-hdr no-print" id="btn-filter" onclick="filterRecords()" title="فلٹر">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
                </svg>
                <span id="lbl-btn-filter">فلٹر</span>
            </button>
            <button type="button" class="btn btn-o btn-hdr no-print" id="btn-print" onclick="printCurrentPage()" title="پرنٹ">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 6 2 18 2 18 9"/>
                    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
                    <rect x="6" y="14" width="12" height="8"/>
                </svg>
                <span id="lbl-btn-print">پرنٹ</span>
            </button>
            <button type="button" class="btn btn-o btn-hdr no-print" id="btn-clearfilter" onclick="clearFilter()" title="فلٹر صاف کریں">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                    <path d="M21 3v5h-5"/>
                    <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                    <path d="M8 16H3v5"/>
                </svg>
                <span id="lbl-btn-clear">صاف</span>
            </button>
        </div>
    </div>

    <!-- Filter Row Grid -->
    <div class="grid records-filter-grid">
        <div class="fg search-fg" style="min-width: 200px;">
            <label id="lbl-recsearch">سرچ (واوچر / پارٹی / فلائیٹ)</label>
            <div class="rec-search-wrap">
                <input type="text" id="f-search" placeholder="تلاش کریں..." oninput="filterRecords()" />
            </div>
        </div>
        <div class="fg">
            <label id="lbl-recfrom">تاریخ سے</label>
            <input type="date" id="f-from" onchange="filterRecords()" />
        </div>
        <div class="fg">
            <label id="lbl-recto">تاریخ تک</label>
            <input type="date" id="f-to" onchange="filterRecords()" />
        </div>
        <div class="fg">
            <label id="lbl-recparty">پارٹی</label>
            <select id="f-party" onchange="filterRecords()"></select>
        </div>
        <div class="fg">
            <label id="lbl-recsector">سیکٹر</label>
            <select id="f-sector" onchange="filterRecords()"></select>
        </div>
    </div>
</div>

<!-- Print Header (only for printing) -->
<div class="print-header">
    <div class="ph-title">Umrah Transport Management System</div>
    <div class="ph-sub ph-sub-text">تمام ریکارڈ — All Records</div>
    <div class="ph-meta"><span class="ph-range"></span><span class="ph-printed-on"></span></div>
</div>

<!-- Records Output Container (Subtabs, Strip & Table Card) -->
<div id="rec-output"></div>

<!-- Print Footer -->
<div class="print-footer">Umrah Transport Management System — Generated Report</div>
</body>
