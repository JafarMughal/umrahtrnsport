<!-- ===== PARTY LEDGER ===== -->
<div class="card ledger-filter-card">
    <!-- Card Header -->
    <div class="card-header-bar">
        <div class="card-title-group">
            <div class="card-title-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                </svg>
            </div>
            <div class="card-title-text">
                <h2 class="card-title" id="lbl-ledgerTitle">پارٹی لیجر</h2>
                <div class="card-subtitle">پارٹی کے تمام لین دین، بیلنس اور تفصیلات</div>
            </div>
        </div>

        <!-- Header Actions: Print / Export / Reset -->
        <div class="card-header-actions ledger-hdr-actions">
            <button type="button" class="btn btn-o btn-hdr no-print" id="btn-print" onclick="printCurrentPage()" title="پرنٹ">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 6 2 18 2 18 9" />
                    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
                    <rect x="6" y="14" width="12" height="8" />
                </svg>
                <span id="lbl-btn-print">پرنٹ</span>
            </button>
            <button type="button" class="btn btn-o btn-hdr no-print" id="btn-exportledger" onclick="exportLedgerExcel()" title="Excel ایکسپورٹ">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
                <span id="lbl-btn-excel">Excel</span>
            </button>
            <button type="button" class="btn btn-o btn-hdr no-print" id="btn-resetled" onclick="clearLedgerFilter()" title="فلٹر صاف کریں">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                    <path d="M21 3v5h-5" />
                    <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                    <path d="M8 16H3v5" />
                </svg>
                <span id="lbl-btn-reset">صاف</span>
            </button>
        </div>
    </div>

    <!-- Filter Row -->
    <div class="grid ledger-filter-grid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-top: 14px; margin-bottom: 4px;">
        <div class="fg">
            <label id="lbl-ledparty">پارٹی</label>
            <div class="ddr">
                <select id="l-party" onchange="filterLedger()" style="flex:1;">
                    <option value="">-- تمام پارٹیاں --</option>
                </select>
            </div>
        </div>
        <div class="fg">
            <label id="lbl-ledfrom">تاریخ سے</label>
            <input type="date" id="l-from" onchange="filterLedger()" />
        </div>
        <div class="fg">
            <label id="lbl-ledto">تاریخ تک</label>
            <input type="date" id="l-to" onchange="filterLedger()" />
        </div>
    </div>
</div>

<!-- Print Header (only for printing) -->
<div class="print-header">
    <div class="ph-title">Umrah Transport Management System</div>
    <div class="ph-sub ph-sub-text">پارٹی لیجر — Party Ledger</div>
    <div class="ph-meta">
        <span class="ph-range"></span>
        <span class="ph-printed-on"></span>
    </div>
</div>

<!-- Ledger Output -->
<div id="ledger-output" style="margin-top: 16px;"></div>

<!-- Print Footer -->
<div class="print-footer">Umrah Transport Management System — Generated Report</div>
</body>
