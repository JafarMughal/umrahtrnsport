<!-- ===== REPORT CENTER ===== -->
<div class="card report-filter-card">
    <!-- Card Header Bar -->
    <div class="card-header-bar">
        <div class="card-title-group">
            <div class="card-title-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="20" x2="18" y2="10"/>
                    <line x1="12" y1="20" x2="12" y2="4"/>
                    <line x1="6" y1="20" x2="6" y2="14"/>
                </svg>
            </div>
            <div class="card-title-text">
                <h2 class="card-title" id="lbl-repTitle">رپورٹ سینٹر</h2>
                <div class="card-subtitle">تاریخ، پارٹی، ٹرانسپورٹر اور سیکٹر کے مطابق رپورٹس</div>
            </div>
        </div>

        <!-- Header Actions: Print / Excel / Reset -->
        <div class="card-header-actions report-hdr-actions">
            <button type="button" class="btn btn-o btn-hdr no-print" id="btn-print" onclick="printCurrentPage()" title="پرنٹ">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 6 2 18 2 18 9" />
                    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
                    <rect x="6" y="14" width="12" height="8" />
                </svg>
                <span id="lbl-btn-print">پرنٹ</span>
            </button>
            <button type="button" class="btn btn-o btn-hdr no-print" id="btn-exportreport" onclick="exportReportExcel()" title="Excel ایکسپورٹ">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
                <span id="lbl-btn-excel">Excel</span>
            </button>
            <button type="button" class="btn btn-o btn-hdr no-print" id="btn-resetreport" onclick="clearReportFilter()" title="فلٹر صاف کریں">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                    <path d="M21 3v5h-5"/>
                    <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                    <path d="M8 16H3v5"/>
                </svg>
                <span id="lbl-btn-reset">صاف</span>
            </button>
        </div>
    </div>

    <!-- Filter Grid -->
    <div class="grid report-filter-grid">
        <div class="fg">
            <label id="lbl-repfrom">تاریخ سے</label>
            <input type="date" id="r-from" onchange="genReport()" />
        </div>
        <div class="fg">
            <label id="lbl-repto">تاریخ تک</label>
            <input type="date" id="r-to" onchange="genReport()" />
        </div>
        <div class="fg">
            <label id="lbl-reptype">رپورٹ کی قسم</label>
            <div class="ddr">
                <select id="r-type" onchange="toggleReportParty(); genReport();">
                    <option value="date" id="opt-bydate">تاریخ وائز</option>
                    <option value="party" id="opt-byparty">ٹرانسپورٹر وائز</option>
                    <option value="newparty" id="opt-bynewparty">پارٹی وائز</option>
                    <option value="sector" id="opt-bysector">سیکٹر وائز</option>
                </select>
            </div>
        </div>
        <div class="fg" id="r-party-wrap" style="display:none;">
            <label id="lbl-rparty">پارٹی منتخب کریں</label>
            <div class="ddr">
                <select id="r-party" onchange="genReport()">
                    <option value="">-- All --</option>
                </select>
            </div>
        </div>
        <div class="fg" style="display:flex; align-items:flex-end;">
            <button type="button" class="btn btn-p btn-genrep" id="btn-genrep" onclick="genReport()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
                </svg>
                <span>رپورٹ بنائیں</span>
            </button>
        </div>
    </div>

    <!-- Print Header -->
    <div class="print-header">
        <div class="ph-title">Umrah Transport Management System</div>
        <div class="ph-sub ph-sub-text">رپورٹ سینٹر — Report Center</div>
        <div class="ph-meta">
            <span class="ph-range" id="rep-print-range"></span>
            <span class="ph-printed-on" id="rep-print-date"></span>
        </div>
    </div>

    <!-- Report Output Container -->
    <div id="rep-out" class="report-output-wrap"></div>

    <!-- Print Footer -->
    <div class="print-footer">Umrah Transport Management System — Generated Report</div>
</div>
</body>
